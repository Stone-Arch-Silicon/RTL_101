# Tiny Tapeout project information (example for Lesson 12).
# Copy the fields you need into the info.yaml of your own Tiny Tapeout repository.
project:
  title:        "SASi PWM"
  author:       "Stone Arch Silicon"
  discord:      ""
  description:  "8-bit PWM generator with the duty cycle set by the input pins"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x1"

  top_module:  "tt_um_sasi_pwm"

  source_files:
    - "project.v"

pinout:
  ui[0]: "duty[0]"
  ui[1]: "duty[1]"
  ui[2]: "duty[2]"
  ui[3]: "duty[3]"
  ui[4]: "duty[4]"
  ui[5]: "duty[5]"
  ui[6]: "duty[6]"
  ui[7]: "duty[7]"

  uo[0]: "pwm"
  uo[1]: "pwm_n"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: "count[4]"
  uo[5]: "count[5]"
  uo[6]: "count[6]"
  uo[7]: "count[7]"

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
